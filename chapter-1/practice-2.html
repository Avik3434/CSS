<!--Q2: Create 3 headings with h1, h2, h3 . Give them all a class "heading" & set color of "heading" to red -->

<!--
    Q3: Create a button and set its color to green using
        1. External stylesheeet
        2. <style></style> tag
        3. inline styling -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice-2</title>
    <style>
        .heading {
            color: #ff0000;
            text-align: center;
        }
        .first-button{
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <h1 class="heading">This is heading one</h1>
    <h2 class="heading">This is heading two</h2>
    <h3 class="heading">This is heading three</h3>

    <button style="background-color: green" class="first-button">Click me</button>
</body>
</html>
