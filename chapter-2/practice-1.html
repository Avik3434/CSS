<!-- Q1. Create a div with both height and widht to 100px, bg color = green and border radius to 50% -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice-1</title>
    <style>
        #circle {
            height: 100px;
            width: 100px;
            background: green;
            border-radius: 50%;
            margin: 25px 0px 0px 25px;
        }
    </style>
</head>
<body>
    <div id="circle">
    </div>
</body>
</html>
