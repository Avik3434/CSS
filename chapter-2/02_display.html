<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .box {
            height: 200px;
            width: 200px;
            margin: 0px 10px 0px 0px;
            display: inline-block;
            border-radius: 12px;
            font-size: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Display Playground</h1>
    <div style="background-color: rgba(255, 0, 0, 0.2);" class="box">box1</div>
    <div style="background-color: green;" class="box">box2</div>
    <div style="background-color: blue;" class="box">box3</div>
</body>
</html>
